spring.application.name=brightminds-rebuild
app.tutor.provider=simulated
app.tutor.stream-idle-timeout=8s
app.tutor.simulated-token-delay=35ms
app.tutor.history-max-messages=20
app.tutor.openai-compatible.base-url=${TUTOR_MODEL_BASE_URL:}
app.tutor.openai-compatible.api-key=${DASHSCOPE_API_KEY:}
app.tutor.openai-compatible.model=${TUTOR_MODEL_NAME:qwen-plus}
app.tutor.openai-compatible.connect-timeout=5s
app.tutor.openai-compatible.max-retries=1
app.tutor.openai-compatible.retry-backoff=200ms
